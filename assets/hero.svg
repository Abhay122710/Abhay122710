
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="280" viewBox="0 0 900 280" role="img">
  <title>Abhay Chaudhary GitHub profile graphic</title>

  <style>
    .bg { fill: #070b16; }
    .panel { fill: #0e1728; stroke: #243650; stroke-width: 1.5; }
    .white { fill: #f5f7ff; }
    .muted { fill: #a9b5cc; }
    .blue { fill: #247bff; }
    .red { fill: #ff354f; }
    .mono { font-family: ui-monospace, Consolas, monospace; }
    .display { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }

    .anim { animation: fadein 1.2s ease both; }
    @keyframes fadein {
      from { opacity: .25; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; }
    }
  </style>

  <rect class="bg" width="900" height="280" rx="18"/>

  <g class="anim">
    <text x="42" y="44" class="mono blue" font-size="14">
      HELLO, WORLD / DEVELOPER PROFILE
    </text>

    <text x="42" y="105" class="display white" font-size="43">
      Abhay Chaudhary
    </text>

    <text x="42" y="142" class="white" font-size="19">
      Aspiring Software Developer
    </text>

    <text x="42" y="174" class="muted" font-size="16">
      B.Tech CSE · Graphics &amp; Gaming · UPES Dehradun
    </text>

    <text x="42" y="204" class="muted" font-size="15">
      Game development · UI/UX · 3D graphics
    </text>

    <rect x="42" y="226" width="8" height="8" rx="4" class="red"/>

    <text x="60" y="235" class="mono muted" font-size="13">
      DEHRADUN, INDIA
    </text>

    <rect x="650" y="30" width="210" height="220" rx="16" class="panel"/>

    <defs>
      <clipPath id="portraitClip">
        <rect x="675" y="55" width="160" height="170" rx="12"/>
      </clipPath>
    </defs>

       
<image
  x="675"
  y="55"
  width="160"
  height="170"
  href="data:image/png;base64,PASTE_BASE64_IMAGE_DATA_HERE"
  preserveAspectRatio="xMidYMid meet"
  clip-path="url(#portraitClip)"
/>

    <rect x="675" y="55" width="160" height="170" rx="12"
          fill="none" stroke="#247bff" stroke-width="1.5"/>
  </g>
</svg>
