name: Refresh profile cards

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_readme_cards.py
      - fonts/**
      - assets/portrait-small.png
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public activity and render cards
        run: python3 scripts/render_readme_cards.py --refresh
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/ data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile activity cards'
            git push
          fi
